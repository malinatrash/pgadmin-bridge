name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install psql for the end-to-end test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Lint
        run: pipx run ruff==0.8.4 check pgadmin_bridge tests
      - name: Test
        run: python -m unittest discover tests -b -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
