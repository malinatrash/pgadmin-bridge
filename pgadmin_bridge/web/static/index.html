<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pgadmin-bridge</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components/controls.css">
<link rel="stylesheet" href="css/components/surfaces.css">
<link rel="stylesheet" href="css/components/overlays.css">
<link rel="stylesheet" href="css/views.css">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#/overview" aria-label="pgadmin-bridge home">
      <img class="brand-logo" src="favicon.svg" alt="">
      <span class="brand-name">pgadmin-bridge</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sidebar-foot">
      <div class="listener" id="listener"></div>
      <div class="sidebar-row">
        <span class="version" id="version"></span>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle color theme"></button>
      </div>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
