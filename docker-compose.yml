services:
  pgadmin-bridge:
    build: .
    image: ghcr.io/malinatrash/pgadmin-bridge:latest
    ports:
      # both listeners are published on the host's loopback only
      - "127.0.0.1:${BRIDGE_PORT:-5555}:5432"
      - "127.0.0.1:${BRIDGE_WEB_PORT:-8080}:8080"
    volumes:
      - pgadmin-bridge-data:/data
    environment:
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgadmin-bridge-data:
